{% if type == "bool" %}
{% if value is not None %}
<div class="px-6 py-3.5 border-b border-slate-50">
    <p class="text-xs font-medium text-slate-400 mb-1">{{ label }}</p>
    {% if value %}
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-50 text-green-700 border border-green-200">
            <i class="fas fa-check text-xs"></i> Ya
        </span>
    {% else %}
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-600 border border-red-200">
            <i class="fas fa-times text-xs"></i> Tidak
        </span>
    {% endif %}
</div>
{% endif %}
{% elif type == "long" %}
{% if value %}
<div class="col-span-2 px-6 py-3.5 border-b border-slate-50">
    <p class="text-xs font-medium text-slate-400 mb-1">{{ label }}</p>
    <p class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap">{{ value }}</p>
</div>
{% endif %}
{% else %}
{% if value %}
<div class="px-6 py-3.5 border-b border-slate-50">
    <p class="text-xs font-medium text-slate-400 mb-1">{{ label }}</p>
    <p class="text-slate-700 text-sm font-medium">{{ value }}</p>
</div>
{% endif %}
{% endif %}
