{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Padam Pengguna | YBTMK</title>
    <link rel="icon" type="image/png" href="{% static 'home/images/jata negara.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-slate-50 min-h-screen antialiased flex items-center justify-center px-4">
<div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="bg-red-600 px-6 py-5">
            <h1 class="text-white font-bold text-lg flex items-center gap-2">
                <i class="fas fa-trash"></i> Padam Pengguna
            </h1>
        </div>
        <div class="px-6 py-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 rounded-2xl bg-red-100 flex items-center justify-center text-red-600 font-bold text-xl shrink-0">
                    {{ target.username|first|upper }}
                </div>
                <div>
                    <p class="font-bold text-slate-800 text-lg">{{ target.username }}</p>
                    {% if target.get_full_name %}<p class="text-slate-500 text-sm">{{ target.get_full_name }}</p>{% endif %}
                </div>
            </div>
            <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 mb-6">
                <p class="text-red-700 text-sm font-medium">&#9888; Adakah anda pasti mahu memadam pengguna ini? Tindakan ini tidak boleh dibatalkan.</p>
            </div>
            <form method="post" class="flex gap-3">
                {% csrf_token %}
                <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fas fa-trash"></i> Ya, Padam
                </button>
                <a href="{% url 'home:urus_pengguna' %}" class="px-5 py-2.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition">Batal</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
