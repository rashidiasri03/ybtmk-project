{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>1. Latar Belakang | YBTMK</title>
    <link rel="icon" type="image/png" href="{% static 'home/images/jata negara.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: #f0f4fa; }
        .q-card { background:#f8fafd; border:1.5px solid #edf1f8; border-radius:12px; padding:16px 18px; transition:all .2s; }
        .q-card:focus-within { background:#fff; box-shadow:0 3px 14px rgba(79,70,229,.08); border-color:#c7d2fe; }
        .sec-group { background:#fff; border:1.5px solid #e4eaf5; border-radius:20px; padding:20px 20px 18px; box-shadow:0 2px 16px rgba(79,70,229,.05); }
        .sec-title { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-bottom:13px; border-bottom:1.5px solid #f0f4fb; }
        .sec-dot { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:bold; flex-shrink:0; }
        .f-input { width:100%; border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:.85rem; outline:none; transition:all .15s; }
        .f-input:focus { border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,.1); }
        .btn-submit { background:linear-gradient(110deg,#4f46e5,#6366f1); color:#fff; border:none; border-radius:14px; padding:13px 36px; font-size:.9rem; font-weight:800; cursor:pointer; }
    </style>
</head>
<body class="min-h-screen">
<nav class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-40">
    <div class="px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center"><img src="{% static 'home/images/jata negara.png' %}" alt="KKM" class="w-6 h-6 object-contain"></div>
            <div><p class="text-[9px] font-bold tracking-widest text-indigo-600 uppercase leading-none">KKM</p><p class="text-sm font-extrabold text-slate-800 leading-none">Latar Belakang</p></div>
        </div>
        <a href="{% url 'home:pilih_modul' fp.pk %}" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50">Kembali</a>
    </div>
</nav>

<div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-indigo-500 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:24px 24px;"></div>
    <div class="relative z-10 px-10 py-7">
        <h1 class="text-white text-xl font-extrabold mb-1">BAHAGIAN 1: LATAR BELAKANG</h1>
        <p class="text-indigo-100 text-xs opacity-80">{{ fp.nama_fasiliti }}</p>
    </div>
</div>

<main class="px-8 pb-16 pt-6">
<form method="post" class="space-y-6">
{% csrf_token %}

<div class="sec-group">
    <div class="sec-title"><div class="sec-dot bg-indigo-50 text-indigo-600">1.1</div><span class="sec-label font-extrabold text-slate-700">Maklumat Responden</span></div>
    <div class="grid grid-cols-2 gap-4">
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Nama Penuh</label><input type="text" name="nama_responden" class="f-input" value="{{ fp.maklumat_asas.nama_responden|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Jawatan</label><input type="text" name="jawatan_responden" class="f-input" value="{{ fp.maklumat_asas.jawatan_responden|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">No. Telefon</label><input type="text" name="no_telefon_responden" class="f-input" value="{{ fp.maklumat_asas.no_telefon_responden|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">E-mel Rasmi</label><input type="email" name="emel_responden" class="f-input" value="{{ fp.maklumat_asas.emel_responden|default:'' }}"></div>
    </div>
</div>

<div class="sec-group">
    <div class="sec-title"><div class="sec-dot bg-indigo-50 text-indigo-600">1.2</div><span class="sec-label font-extrabold text-slate-700">Maklumat Fasiliti & Lokasi</span></div>
    <div class="grid grid-cols-2 gap-4">
        <div class="q-card col-span-2"><label class="block text-xs font-bold text-slate-500 mb-2">Nama Fasiliti Kesihatan <span class="text-red-500">*</span></label><input type="text" name="nama_fasiliti" class="f-input font-bold text-indigo-700" value="{{ fp.maklumat_asas.nama_fasiliti|default:'' }}" required></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Ketua Fasiliti</label><input type="text" name="ketua_fasiliti" class="f-input" value="{{ fp.maklumat_asas.ketua_fasiliti|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Kod Fasiliti</label><input type="text" name="kod_fasiliti" class="f-input" value="{{ fp.maklumat_asas.kod_fasiliti|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Kategori Fasiliti</label><input type="text" name="kategori_fasiliti" class="f-input" value="{{ fp.maklumat_asas.kategori_fasiliti|default:'' }}"></div>
        
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-2">Jenis Fasiliti <span class="text-red-500">*</span></label>
            <select name="jenis_fasiliti" class="f-input bg-white" required>
                <option value="">-- Pilih Jenis --</option>
                <option value="hospital" {% if fp.maklumat_asas.jenis_fasiliti == 'hospital' %}selected{% endif %}>Hospital</option>
                <option value="hospital_pakar" {% if fp.maklumat_asas.jenis_fasiliti == 'hospital_pakar' %}selected{% endif %}>Hospital Pakar</option>
                <option value="klinik_kesihatan" {% if fp.maklumat_asas.jenis_fasiliti == 'klinik_kesihatan' %}selected{% endif %}>Klinik Kesihatan</option>
                <option value="klinik_desa" {% if fp.maklumat_asas.jenis_fasiliti == 'klinik_desa' %}selected{% endif %}>Klinik Desa</option>
                <option value="klinik_pergigian" {% if fp.maklumat_asas.jenis_fasiliti == 'klinik_pergigian' %}selected{% endif %}>Klinik Pergigian</option>
                <option value="lain" {% if fp.maklumat_asas.jenis_fasiliti == 'lain' %}selected{% endif %}>Lain-lain</option>
            </select>
        </div>

        <div class="q-card col-span-2"><label class="block text-xs font-bold text-slate-500 mb-2">Alamat Penuh</label><textarea name="alamat" class="f-input h-20">{{ fp.maklumat_asas.alamat|default:'' }}</textarea></div>
        
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Poskod</label><input type="text" name="poskod" class="f-input" value="{{ fp.maklumat_asas.poskod|default:'' }}"></div>
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Daerah / Bandar</label><input type="text" name="daerah" class="f-input" value="{{ fp.maklumat_asas.daerah|default:'' }}"></div>
        
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-2">Negeri</label>
            <select name="negeri" class="f-input bg-white">
                <option value="">-- Pilih Negeri --</option>
                <option value="johor" {% if fp.maklumat_asas.negeri == 'johor' %}selected{% endif %}>Johor</option>
                <option value="kedah" {% if fp.maklumat_asas.negeri == 'kedah' %}selected{% endif %}>Kedah</option>
                <option value="selangor" {% if fp.maklumat_asas.negeri == 'selangor' %}selected{% endif %}>Selangor</option>
                <option value="sarawak" {% if fp.maklumat_asas.negeri == 'sarawak' %}selected{% endif %}>Sarawak</option>
                <option value="sabah" {% if fp.maklumat_asas.negeri == 'sabah' %}selected{% endif %}>Sabah</option>
                <option value="wp_kl" {% if fp.maklumat_asas.negeri == 'wp_kl' %}selected{% endif %}>W.P. Kuala Lumpur</option>
                <!-- Anda boleh tambah senarai negeri penuh di sini -->
            </select>
        </div>
        
        <div class="q-card"><label class="block text-xs font-bold text-slate-500 mb-2">Latitud & Longitud (Format: 3.123, 101.456)</label>
            <div class="flex gap-2">
                <input type="text" name="latitud" class="f-input" placeholder="Latitud" value="{{ fp.maklumat_asas.latitud|default:'' }}">
                <input type="text" name="longitud" class="f-input" placeholder="Longitud" value="{{ fp.maklumat_asas.longitud|default:'' }}">
            </div>
        </div>
    </div>
</div>

<div class="flex items-center justify-between pt-2">
    <a href="{% url 'home:pilih_modul' fp.pk %}" class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">Batal</a>
    <button type="submit" class="btn-submit"><i class="fas fa-save mr-2"></i> Kemaskini Latar Belakang</button>
</div>
</form>
</main>
</body>
</html>
