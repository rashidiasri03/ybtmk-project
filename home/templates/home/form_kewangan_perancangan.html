{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>6. Kewangan & Perancangan | YBTMK</title>
    <link rel="icon" type="image/png" href="{% static 'home/images/jata negara.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: #f0f4fa; }
        .pill-item input[type="radio"] { display:none; }
        .pill-item label { display:inline-flex; align-items:center; gap:7px; padding:9px 22px; border-radius:99px; border:2px solid #e2e8f0; cursor:pointer; font-size:.8rem; font-weight:700; color:#64748b; background:#fff; transition:all .15s ease; user-select:none; }
        .pill-item label:hover { border-color:#94a3b8; }
        .pill-item input:checked + label.ya { border-color:#ca8a04; background:#fefce8; color:#a16207; }
        .pill-item input:checked + label.tidak { border-color:#ef4444; background:#fef2f2; color:#dc2626; }
        .q-card { background:#f8fafd; border:1.5px solid #edf1f8; border-radius:12px; padding:16px 18px; transition:box-shadow .2s, border-color .2s; }
        .q-card:focus-within { background:#fff; box-shadow:0 3px 14px rgba(202,138,4,.08); border-color:#fde047; }
        .sec-group { background:#fff; border:1.5px solid #e4eaf5; border-radius:20px; padding:20px 20px 18px; box-shadow:0 2px 16px rgba(202,138,4,.05); }
        .sec-title { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-bottom:13px; border-bottom:1.5px solid #f0f4fb; }
        .sec-dot { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:bold; flex-shrink:0; }
        .sec-label { font-size:.8rem; font-weight:800; color:#334155; letter-spacing:.01em; text-transform:uppercase; }
        .f-input, .f-textarea { width:100%; border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:.85rem; color:#1e293b; outline:none; transition:all .15s; background:#fff; }
        .f-input:focus, .f-textarea:focus { border-color:#ca8a04; box-shadow:0 0 0 3px rgba(202,138,4,.1); }
        .f-textarea { resize:vertical; min-height:80px; }
        .btn-submit { background:linear-gradient(110deg,#ca8a04,#eab308); color:#fff; border:none; border-radius:14px; padding:13px 36px; font-size:.9rem; font-weight:800; cursor:pointer; transition:all .2s; box-shadow:0 4px 20px rgba(202,138,4,.3); }
        .btn-submit:hover { opacity:.9; transform:translateY(-1px); }
        @keyframes fadeUp { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
        .fade-in { opacity:0; animation:fadeUp .4s ease both; }
    </style>
</head>
<body class="min-h-screen">
<nav class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-40">
    <div class="px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-yellow-50 border border-yellow-100 flex items-center justify-center shrink-0 overflow-hidden"><img src="{% static 'home/images/jata negara.png' %}" alt="KKM" class="w-6 h-6 object-contain"></div>
            <div><p class="text-[9px] font-bold tracking-widest text-yellow-600 uppercase leading-none">KKM</p><p class="text-sm font-extrabold text-slate-800 leading-none">Kewangan & Perancangan</p></div>
        </div>
        <a href="{% url 'home:pilih_modul' fp.pk %}" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition"><i class="fas fa-arrow-left text-xs"></i> Kembali</a>
    </div>
</nav>

<div class="bg-gradient-to-r from-yellow-700 via-yellow-600 to-yellow-500 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:24px 24px;"></div>
    <div class="relative z-10 px-10 py-7">
        <h1 class="text-white text-xl font-extrabold mb-1">BAHAGIAN 6: KEWANGAN, KONSESI & PERANCANGAN</h1>
        <p class="text-yellow-100 text-xs opacity-80">{{ fp.nama_fasiliti }}</p>
    </div>
</div>

<main class="px-8 pb-16 pt-6">
<form method="post" class="space-y-6">
{% csrf_token %}

<div class="sec-group fade-in" style="animation-delay:.1s;">
    <div class="sec-title"><div class="sec-dot bg-yellow-50 text-yellow-600">6.1</div><span class="sec-label">Peruntukan Kewangan</span></div>
    <div class="space-y-3">
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-1.5">Belanja Mengurus (Operational Expenditure)</label>
            <input type="text" name="belanja_mengurus" class="f-input font-mono" value="{{ belanja_mengurus|default:'' }}">
        </div>
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-1.5">Belanja Pembangunan (Development Expenditure)</label>
            <input type="text" name="belanja_pembangunan" class="f-input font-mono" value="{{ belanja_pembangunan|default:'' }}">
        </div>
    </div>
</div>

<div class="sec-group fade-in" style="animation-delay:.15s;">
    <div class="sec-title"><div class="sec-dot bg-yellow-50 text-yellow-600">6.2</div><span class="sec-label">Perkhidmatan Konsesi & Isu Utama</span></div>
    <div class="space-y-3">
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-2">Adakah perkhidmatan penyelenggaraan konsesi berjalan lancar?</label>
            <div class="flex gap-2 flex-wrap">
                <div class="pill-item"><input type="radio" name="maintenance_okay" id="maint_ya" value="1" {% if maintenance_okay == True %}checked{% endif %}><label for="maint_ya" class="ya"><i class="fas fa-check text-[10px]"></i> Ya, Memuaskan</label></div>
                <div class="pill-item"><input type="radio" name="maintenance_okay" id="maint_tidak" value="0" {% if maintenance_okay == False %}checked{% endif %}><label for="maint_tidak" class="tidak"><i class="fas fa-times text-[10px]"></i> Tidak Memuaskan</label></div>
            </div>
        </div>
        <div class="q-card">
            <label class="block text-xs font-bold text-slate-500 mb-1.5">Nyatakan isu / masalah utama yang dihadapi berkaitan penyampaian fasiliti ini</label>
            <textarea name="masalah_utama" class="f-textarea">{{ masalah_utama|default:'' }}</textarea>
        </div>
    </div>
</div>

<div class="sec-group fade-in" style="animation-delay:.2s;">
    <div class="sec-title"><div class="sec-dot bg-yellow-50 text-yellow-600">6.3</div><span class="sec-label">Perancangan Masa Depan</span></div>
    <div class="q-card">
        <label class="block text-xs font-bold text-slate-500 mb-1.5">Apakah fasiliti / infrastruktur baharu yang sangat diperlukan?</label>
        <textarea name="fasiliti_diperlukan" class="f-textarea">{{ fasiliti_diperlukan|default:'' }}</textarea>
    </div>
</div>

<div class="fade-in flex items-center justify-between pt-2" style="animation-delay:.25s;">
    <a href="{% url 'home:pilih_modul' fp.pk %}" class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition"><i class="fas fa-times text-xs"></i> Batal</a>
    <button type="submit" class="btn-submit"><i class="fas fa-save mr-2"></i> Kemaskini Kewangan & Perancangan</button>
</div>
</form>
</main>
</body>
</html>
